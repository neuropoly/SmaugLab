# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install once per clone with:
#   pip install -e ".[dev]"
#   pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Augmentation work produces large NIfTI/weight files; .gitignore covers
        # the usual suspects, this catches the rest before they reach a PR.
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
