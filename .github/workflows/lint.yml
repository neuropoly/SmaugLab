name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the pre-commit hooks rather than a bare `ruff check`, so the hooks
  # contributors run locally and the ones CI enforces cannot drift apart.
  #
  # Deliberately does NOT auto-commit fixes back to the branch: that breaks on
  # pull requests from forks and rewrites contributors' branches under them.
  # A red check plus `pre-commit run --all-files` locally is the fix.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # mypy is a CI job rather than a pre-commit hook because it needs the project's
  # dependencies importable to be worth anything: without kornia and torch installed
  # every annotation resolves to Any and the check passes while checking nothing.
  # That install is too heavy for a hook contributors run on every commit.
  #
  # Config lives in [tool.mypy] in pyproject.toml. `smauglab/` only -- unit_tests/
  # and scripts/ are excluded there.
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # poetry-dynamic-versioning derives the version from the git tag;
          # a shallow clone has no tags and would build as 0.0.0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The floor of the supported range, matching `python_version = "3.10"` in
          # [tool.mypy] -- not the newest interpreter. mypy applies its target version
          # when parsing *every* file, third-party stubs included, so a runner that
          # resolves a dependency too new for that target breaks the job with an error
          # in someone else's .pyi. That is what numpy did: 2.3+ requires Python >=3.11
          # and its stubs use PEP 695 `type` statements, so a 3.12 runner installed
          # numpy 2.5 and mypy rejected numpy/__init__.pyi as 3.12-only syntax.
          # Installing on 3.10 resolves numpy 2.2.x, whose stubs parse under the target.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        # Must come first, same as in tests.yml: the default index serves the CUDA
        # build (several GB of nvidia-* wheels), which is slow and can fill the
        # runner disk. Nothing here needs a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install SmaugLab
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy smauglab/
