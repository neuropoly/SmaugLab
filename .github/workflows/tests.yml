name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    # Linux only. The suite is pure CPU torch/kornia, and paying the torch
    # install cost on a Windows runner buys nothing for a pipeline that only
    # ever runs on Linux clusters.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject sets requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # poetry-dynamic-versioning derives the version from the git tag;
          # a shallow clone has no tags and would build as 0.0.0.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        # Must come first. Installing from the default index pulls the CUDA
        # build (several GB of nvidia-* wheels), which is slow and can fill the
        # runner disk. Nothing here needs a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install AugLab
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --cov=auglab --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        # Only after a merge to main, and only once per matrix.
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  kornia-compat:
    # auglab subclasses kornia's private augmentation internals, which move
    # between minor releases -- kornia 0.8.3 dropped kornia.core.Module and the
    # whole kornia.utils.helpers module. The `test` job only ever installs the
    # newest kornia, so it cannot catch a break at the other end of the
    # supported range. This job pins both ends.
    name: kornia ${{ matrix.kornia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, matching the pin in pyproject.toml.
        kornia-version: ["0.7.3", "0.8.3"]

    steps:
      - uses: actions/checkout@v4
        with:
          # poetry-dynamic-versioning derives the version from the git tag;
          # a shallow clone has no tags and would build as 0.0.0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install AugLab with a pinned kornia
        run: |
          pip install -e ".[dev]"
          pip install "kornia==${{ matrix.kornia-version }}"

      - name: Run tests
        run: pytest -q -m "not slow"

  build:
    name: build distribution
    # Catches packaging breakage on every PR instead of on release day. The
    # published 20260109 wheel shipped without any config JSONs; this job plus
    # unit_tests/test_packaging.py is what stops that recurring.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # poetry-dynamic-versioning derives the version from the git tag;
          # a shallow clone has no tags and would build as 0.0.0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Verify the wheel ships the package data
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          modules = [n for n in names if n.endswith(".py")]
          configs = [n for n in names if n.startswith("auglab/configs/") and n.endswith(".json")]

          print(f"{wheel}: {len(modules)} modules, {len(configs)} configs")
          problems = []
          if len(modules) < 20:
              problems.append(f"only {len(modules)} modules in the wheel")
          if "auglab/configs/transform_params_gpu.json" not in configs:
              problems.append("default transform_params_gpu.json is missing")
          if problems:
              sys.exit("wheel is incomplete: " + "; ".join(problems))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
